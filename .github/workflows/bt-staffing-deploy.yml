name: BT Staffing Deploy to Azure

# Manual on purpose: run it from the Actions tab once the Azure resources
# exist (see bt-staffing/DEPLOY.md).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build the image in Azure Container Registry
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "bt-staffing:${{ github.sha }}" \
            --image "bt-staffing:latest" \
            bt-staffing

      - name: Point the web app at the new image
        run: |
          az webapp config container set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --container-image-name "${{ vars.AZURE_ACR_NAME }}.azurecr.io/bt-staffing:${{ github.sha }}"
          az webapp restart \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}"

      - name: Wait for the app to come up (it runs database migrations on start)
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"
          for i in $(seq 1 30); do
            if curl -fsS "$url"; then exit 0; fi
            sleep 10
          done
          echo "App did not become healthy" && exit 1
